version: 1.3.10
cache: true
fileStrategy: 's3'

interface:
  agents:
    use: true
    create: true
    share: false
    public: false

endpoints:
  agents:
    disableBuilder: false
    capabilities:
      - tools
      - actions
      - file_search
      - execute_code
      - web_search
      - artifacts
      - subagents
      - context
      - skills
      - chain
      - ocr
      - deferred_tools

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'openai/gpt-4o'
          - 'openai/gpt-4o-mini'
          - 'anthropic/claude-opus-4'
          - 'anthropic/claude-sonnet-4-5'
          - 'anthropic/claude-haiku-4-5'
          - 'google/gemini-2.5-pro'
          - 'google/gemini-2.5-flash'
          - 'meta-llama/llama-3.3-70b-instruct'
          - 'mistralai/mistral-large'
          - 'deepseek/deepseek-r1'
          - 'x-ai/grok-3'
        fetch: true
      titleConvo: true
      titleModel: 'openai/gpt-4o-mini'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
